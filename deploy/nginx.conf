server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location = /healthz { default_type text/plain; return 200 'ok\n'; }
  location = /manus-routes.json { try_files $uri =404; add_header Cache-Control 'no-store'; }
  location / { try_files $uri $uri/ /index.html; }
}
